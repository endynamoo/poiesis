name: check

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Suite
        run: python -m unittest discover -s tests -v
      - name: Changelog block is current
        run: python tools/changelog_render.py --check
