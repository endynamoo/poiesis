name: pages

# Deploys the site to GitHub Pages on every push to main.
#
# The repository was private (and Pages switched off) from 2026-11-17 to 2026-11-26,
# because Pages does not publish from a private repository on a free account. It is
# public again, so the push trigger is back and Pages is configured with
# `build_type=workflow`; if the repository ever goes private again, comment the push
# trigger out and delete the Pages site, or every push to main will fail here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
