name: pages

# Deploys the site to GitHub Pages on every push to main.
#
# The repository was private (and Pages switched off) from 2026-11-17 to 2026-11-26,
# because Pages does not publish from a private repository on a free account. It is
# public again, so the push trigger is back and Pages is configured with
# `build_type=workflow`; if the repository ever goes private again, comment the push
# trigger out and delete the Pages site, or every push to main will fail here.
#
# Build and deploy are separate jobs on purpose. In the single-job version the deploy
# step asked for the artifact about a second after the upload finished and got "No
# artifacts named github-pages were found" on roughly half the pushes - the artifact
# index had not caught up. A new job starts after the upload is complete, which is the
# gap the official Pages template relies on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
